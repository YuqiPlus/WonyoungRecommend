name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate and build archives
        run: |
          node --test scripts/test/*.test.mjs
          node scripts/build-timeline.mjs
          node scripts/build-photocards.mjs
          node scripts/build-brands.mjs
          node scripts/build-albums.mjs
          node scripts/build-discovery.mjs
      - name: Check Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" != "workflow" ]; then
            echo "::error::Set Settings > Pages > Build and deployment > Source to GitHub Actions, then rerun this workflow. Branch publishing can overwrite this website with the README."
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
